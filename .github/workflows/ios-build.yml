name: Laundry Dose manual iOS build

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Compile without signing first; signed modes require protected approval
        type: choice
        options: [unsigned, adhoc, appstore]
        default: unsigned
        required: true
      build_number:
        description: Positive build number; use a new number for each Apple upload
        type: string
        default: '4'
        required: true
      upload_to_testflight:
        description: Separate opt-in Apple upload for a verified appstore build
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: laundrydose-manual-ios
  cancel-in-progress: false

env:
  BUILD_MODE: ${{ inputs.mode }}
  PROJECT_BUILD_NUMBER: ${{ inputs.build_number }}
  UPLOAD_TO_TESTFLIGHT: ${{ inputs.upload_to_testflight }}
  COCOAPODS_DISABLE_STATS: 'true'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  CI: 'true'

jobs:
  preflight:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'baewumnote-studio/laundrydose-ios-public-build' && github.ref == 'refs/heads/main' && github.actor == 'baewumnote-studio' && !github.event.repository.private
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check exact publication allowlist, app preservation and build authorization
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 tool/verify_manifest.py
          python3 tool/ci/check_preserved_app.py
          python3 -m unittest discover -s tool/ci -p 'test_*.py'
          python3 tool/ci/production_configuration.py
          python3 tool/ci/public_build_gate.py

  unsigned:
    needs: preflight
    if: inputs.mode == 'unsigned'
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-ios
      - name: Compile Release without Apple credentials
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign --no-pub \
            --build-number="$PROJECT_BUILD_NUMBER" \
            --dart-define=LAUNDRY_DOSE_TEST_ADS=true
          python3 tool/ci/check_unsigned_app.py
          python3 tool/ci/record_native_dependencies.py
      - name: Publish compile evidence without an app binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: unsigned-compile-evidence-${{ github.run_id }}
          retention-days: 1
          if-no-files-found: error
          path: |
            verification/ios-compile-check.json
            verification/native-dependencies.json

  signing-preflight:
    needs: preflight
    if: inputs.mode != 'unsigned'
    environment: apple-distribution
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify real CMS, P12, private key, certificate, app and distribution profile before Mac
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_ADHOC_PROFILE_BASE64: ${{ secrets.IOS_ADHOC_PROFILE_BASE64 }}
          IOS_ADHOC_DEVICE_UDID: ${{ secrets.IOS_ADHOC_DEVICE_UDID }}
          IOS_RELEASE_APP_STORE_PROFILE_BASE64: ${{ secrets.IOS_RELEASE_APP_STORE_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          python3 tool/verify_manifest.py
          python3 tool/ci/check_preserved_app.py
          python3 tool/ci/select_signing.py preflight

  signed:
    needs: [preflight, signing-preflight]
    if: inputs.mode != 'unsigned'
    environment: apple-distribution
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-ios
      - name: Apply production values only for the appstore mode
        if: inputs.mode == 'appstore'
        run: python3 tool/ci/production_configuration.py configure
      - name: Install approved signing identity and app-specific profile
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_ADHOC_PROFILE_BASE64: ${{ secrets.IOS_ADHOC_PROFILE_BASE64 }}
          IOS_ADHOC_DEVICE_UDID: ${{ secrets.IOS_ADHOC_DEVICE_UDID }}
          IOS_RELEASE_APP_STORE_PROFILE_BASE64: ${{ secrets.IOS_RELEASE_APP_STORE_PROFILE_BASE64 }}
        run: python3 tool/ci/select_signing.py install
      - name: Build and verify signed IPA; retain raw output privately
        env:
          IOS_ADHOC_DEVICE_UDID: ${{ secrets.IOS_ADHOC_DEVICE_UDID }}
        run: |
          python3 tool/ci/build_signed.py
          python3 tool/ci/record_native_dependencies.py
      - name: Optional separate TestFlight upload; no review submission
        if: inputs.mode == 'appstore' && inputs.upload_to_testflight
        env:
          IOS_APP_STORE_API_KEY_BASE64: ${{ secrets.IOS_APP_STORE_API_KEY_BASE64 }}
          IOS_APP_STORE_API_KEY_ID: ${{ secrets.IOS_APP_STORE_API_KEY_ID }}
          IOS_APP_STORE_ISSUER_ID: ${{ secrets.IOS_APP_STORE_ISSUER_ID }}
        run: python3 tool/ci/upload_testflight.py
      - name: Encrypt successful output or failed-build diagnostics
        if: always()
        run: python3 tool/ci/protect_artifacts.py
      - name: Upload ciphertext only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: encrypted-private-ios-${{ github.run_id }}
          retention-days: 3
          if-no-files-found: error
          path: |
            verification/private-build.cms
            verification/encrypted-output-receipt.json
      - name: Remove temporary Apple signing material
        if: always()
        run: python3 tool/ci/ios_signing.py cleanup
