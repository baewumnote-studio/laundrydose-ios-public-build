name: laundry_dose
description: Offline-first detergent label dose calculator for iOS.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.41.0"

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/legal/

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  path: ^1.9.1
  image_picker: ^1.2.4
  google_mobile_ads: ^9.1.0
  intl: ^0.20.3
  uuid: ^4.6.0
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.16.1

